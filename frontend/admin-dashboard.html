<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">IB</span> Admin Panel</div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" data-page="admin" class="active">🛠️ Admin Dashboard</a>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebar-user-name" style="display:block;font-size:0.85rem;margin-bottom:8px;color:#cddcec;"></span>
        <button class="btn btn-secondary btn-block" data-action="logout">Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div class="brand"><span class="brand-mark">IB</span> Admin Panel</div>
        <button class="hamburger" id="hamburger">☰</button>
      </div>

      <div class="page-body">
        <div class="page-header"><h1>Admin Dashboard</h1></div>

        <div class="stat-grid">
          <div class="card stat-card">
            <span class="stat-label">Total Customers</span>
            <span class="stat-value" id="stat-total-customers">—</span>
          </div>
          <div class="card stat-card">
            <span class="stat-label">Total Accounts</span>
            <span class="stat-value" id="stat-total-accounts">—</span>
          </div>
          <div class="card stat-card">
            <span class="stat-label">Total Transactions</span>
            <span class="stat-value" id="stat-total-transactions">—</span>
          </div>
          <div class="card stat-card">
            <span class="stat-label">Total Deposits Held</span>
            <span class="stat-value" id="stat-total-deposits-held">—</span>
          </div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <h2>Customers</h2>
          <form id="admin-search-form" class="filter-bar">
            <div class="form-group">
              <label for="admin-search">Search by name, email, or account number</label>
              <input type="text" id="admin-search" placeholder="e.g. John Doe">
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Name</th><th>Email</th><th>Account Number</th><th>Balance</th><th>Status</th><th>Action</th></tr>
              </thead>
              <tbody id="customers-body"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>Recent Transactions (all customers)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>ID</th><th>Customer</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>
              </thead>
              <tbody id="admin-tx-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded", initAdminDashboardPage);</script>
</body>
</html>

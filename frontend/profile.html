<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">IB</span> Internet Banking</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" data-page="dashboard">🏠 Dashboard</a>
        <a href="transfer.html" data-page="transfer">💸 Deposit / Withdraw / Transfer</a>
        <a href="transactions.html" data-page="transactions">📜 Transaction History</a>
        <a href="profile.html" data-page="profile">👤 Profile</a>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebar-user-name" style="display:block;font-size:0.85rem;margin-bottom:8px;color:#cddcec;"></span>
        <button class="btn btn-secondary btn-block" data-action="logout">Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div class="brand"><span class="brand-mark">IB</span> Internet Banking</div>
        <button class="hamburger" id="hamburger">☰</button>
      </div>

      <div class="page-body">
        <div class="page-header"><h1>Your Profile</h1></div>

        <div class="stat-grid" style="margin-bottom:20px;">
          <div class="card stat-card">
            <span class="stat-label">Account Number</span>
            <span class="stat-value" id="profile-account-number" style="font-size:1.1rem;">—</span>
          </div>
          <div class="card stat-card">
            <span class="stat-label">Member Since</span>
            <span class="stat-value" id="profile-created-at" style="font-size:1.1rem;">—</span>
          </div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <h2>Personal Details</h2>
          <form id="profile-form" novalidate>
            <div class="form-group">
              <label for="profile-fullName">Full name</label>
              <input type="text" id="profile-fullName" required>
              <div class="field-error" id="profile-fullName-error"></div>
            </div>
            <div class="form-group">
              <label for="profile-email">Email (cannot be changed)</label>
              <input type="email" id="profile-email" disabled>
            </div>
            <div class="form-group">
              <label for="profile-phone">Phone number</label>
              <input type="tel" id="profile-phone" required>
              <div class="field-error" id="profile-phone-error"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="profile-submit">Save Changes</button>
          </form>
        </div>

        <div class="card">
          <h2>Change Password</h2>
          <form id="password-form" novalidate>
            <div class="form-group">
              <label for="current-password">Current password</label>
              <input type="password" id="current-password" autocomplete="current-password" required>
              <div class="field-error" id="current-password-error"></div>
            </div>
            <div class="form-group">
              <label for="new-password">New password</label>
              <input type="password" id="new-password" autocomplete="new-password" required>
              <div class="field-error" id="new-password-error"></div>
            </div>
            <div class="form-group">
              <label for="confirm-new-password">Confirm new password</label>
              <input type="password" id="confirm-new-password" autocomplete="new-password" required>
              <div class="field-error" id="confirm-new-password-error"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="password-submit">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script>document.addEventListener("DOMContentLoaded", initProfilePage);</script>
</body>
</html>

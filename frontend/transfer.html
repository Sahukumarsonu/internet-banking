<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit / Withdraw / Transfer — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">IB</span> Internet Banking</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" data-page="dashboard">🏠 Dashboard</a>
        <a href="transfer.html" data-page="transfer">💸 Deposit / Withdraw / Transfer</a>
        <a href="transactions.html" data-page="transactions">📜 Transaction History</a>
        <a href="profile.html" data-page="profile">👤 Profile</a>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebar-user-name" style="display:block;font-size:0.85rem;margin-bottom:8px;color:#cddcec;"></span>
        <button class="btn btn-secondary btn-block" data-action="logout">Log Out</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div class="brand"><span class="brand-mark">IB</span> Internet Banking</div>
        <button class="hamburger" id="hamburger">☰</button>
      </div>

      <div class="page-body">
        <div class="page-header">
          <h1>Deposit, Withdraw &amp; Transfer</h1>
          <div class="stat-sub">Current balance: <strong id="current-balance">—</strong> · Your account: <strong id="current-account-number">—</strong></div>
        </div>

        <div class="card">
          <div style="display:flex;gap:8px;border-bottom:1px solid var(--color-border);margin-bottom:20px;">
            <button class="btn btn-secondary tab-btn active" data-tab="deposit" style="border:none;border-bottom:2px solid var(--color-primary);border-radius:0;">Deposit</button>
            <button class="btn btn-secondary tab-btn" data-tab="withdraw" style="border:none;border-radius:0;">Withdraw</button>
            <button class="btn btn-secondary tab-btn" data-tab="transfer" style="border:none;border-radius:0;">Transfer</button>
          </div>

          <div class="tab-panel active" id="panel-deposit">
            <form id="deposit-form" novalidate>
              <div class="form-group">
                <label for="deposit-amount">Amount (₹)</label>
                <input type="number" id="deposit-amount" min="1" step="0.01" required>
                <div class="field-error" id="deposit-amount-error"></div>
              </div>
              <div class="form-group">
                <label for="deposit-description">Description (optional)</label>
                <input type="text" id="deposit-description" maxlength="200" placeholder="e.g. Cash deposit">
              </div>
              <button type="submit" class="btn btn-primary" id="deposit-submit">Deposit Funds</button>
            </form>
          </div>

          <div class="tab-panel" id="panel-withdraw" style="display:none;">
            <form id="withdraw-form" novalidate>
              <div class="form-group">
                <label for="withdraw-amount">Amount (₹)</label>
                <input type="number" id="withdraw-amount" min="1" step="0.01" required>
                <div class="field-error" id="withdraw-amount-error"></div>
              </div>
              <div class="form-group">
                <label for="withdraw-description">Description (optional)</label>
                <input type="text" id="withdraw-description" maxlength="200" placeholder="e.g. ATM withdrawal">
              </div>
              <button type="submit" class="btn btn-primary" id="withdraw-submit">Withdraw Funds</button>
            </form>
          </div>

          <div class="tab-panel" id="panel-transfer" style="display:none;">
            <form id="transfer-form" novalidate>
              <div class="form-group">
                <label for="transfer-receiver">Receiver account number</label>
                <input type="text" id="transfer-receiver" required>
                <div class="field-error" id="transfer-receiver-error"></div>
              </div>
              <div class="form-group">
                <label for="transfer-amount">Amount (₹)</label>
                <input type="number" id="transfer-amount" min="1" step="0.01" required>
                <div class="field-error" id="transfer-amount-error"></div>
              </div>
              <div class="form-group">
                <label for="transfer-description">Description (optional)</label>
                <input type="text" id="transfer-description" maxlength="200" placeholder="e.g. Rent share">
              </div>
              <button type="submit" class="btn btn-primary" id="transfer-submit">Transfer Money</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title">Confirm</h3>
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/transfer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initTransferPage();
      document.querySelectorAll(".tab-panel").forEach(p => p.style.display = p.classList.contains("active") ? "block" : "none");
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-panel").forEach(p => {
            p.style.display = (p.id === "panel-" + btn.dataset.tab) ? "block" : "none";
          });
        });
      });
    });
  </script>
</body>
</html>

# Local development convenience: spins up the C++ backend in a container
# with the same Dockerfile used for Render, and a simple static file
# server for the frontend so you can test both together.
#
# Usage:
#   docker compose up --build
#   Backend:  http://localhost:8080
#   Frontend: http://localhost:8081
#
# This file is NOT required for Render deployment (Render builds
# backend/Dockerfile directly) — it's purely a local dev convenience.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BANK_DB_PATH=/data/bank.db
      - ALLOWED_ORIGINS=*
      - PASSWORD_PEPPER=dev-only-pepper-change-me
      - SESSION_LIFETIME_HOURS=12
    volumes:
      - bank_data:/data

  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
    ports:
      - "8081:8081"
    command: python3 -m http.server 8081

volumes:
  bank_data:

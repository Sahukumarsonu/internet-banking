<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="public-page">
  <header class="public-header">
    <a href="index.html" class="brand"><span class="brand-mark">IB</span> Internet Banking System</a>
    <nav class="nav-actions">
      <a href="login.html" class="btn btn-secondary">Customer Login</a>
    </nav>
  </header>

  <main class="public-main">
    <div class="auth-card">
      <h1>Admin Login</h1>
      <p class="auth-subtitle">Restricted access for bank administrators</p>

      <div id="admin-login-alert" class="alert alert-error" style="display:none;"></div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="admin-email">Admin email</label>
          <input type="email" id="admin-email" required>
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="admin-login-submit">Admin Log In</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>initAdminLoginPage();</script>
</body>
</html>

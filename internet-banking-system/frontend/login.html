<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="public-page">
  <header class="public-header">
    <a href="index.html" class="brand"><span class="brand-mark">IB</span> Internet Banking System</a>
    <nav class="nav-actions">
      <a href="register.html" class="btn btn-secondary">Register</a>
    </nav>
  </header>

  <main class="public-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to access your account</p>

      <div id="login-alert" class="alert alert-error" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <div class="field-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log In</button>
      </form>

      <p class="form-footer-note">
        Don't have an account? <a href="register.html">Register here</a><br>
        <a href="admin.html">Admin login</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initLoginPage();</script>
</body>
</html>

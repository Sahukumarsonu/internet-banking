<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Internet Banking System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="public-page">
  <header class="public-header">
    <a href="index.html" class="brand"><span class="brand-mark">IB</span> Internet Banking System</a>
    <nav class="nav-actions">
      <a href="login.html" class="btn btn-secondary">Log In</a>
    </nav>
  </header>

  <main class="public-main">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-subtitle">A savings account will be created for you automatically</p>

      <div id="register-alert" class="alert alert-error" style="display:none;"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required>
          <div class="field-error" id="fullName-error"></div>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="9876543210" required>
          <div class="field-error" id="phone-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
          <div class="field-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
          <div class="field-error" id="confirmPassword-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create Account</button>
      </form>

      <p class="form-footer-note">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initRegisterPage();</script>
</body>
</html>
